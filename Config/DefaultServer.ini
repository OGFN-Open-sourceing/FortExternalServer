[Process]
GameExecutable=FortniteGame/Binaries/Win64/FortniteClient-Win64-Shipping.exe
AttachTimeoutSeconds=180
LaunchSuspended=True

[Engine]
ExpectedFortniteVersion=3.6
ExpectedChangelist=4019403
ExpectedEngineVersion=4.19
EnforceVersionMatch=True

[Session]
Map=Athena_Terrain
GameMode=/Game/Athena/Athena_GameMode.Athena_GameMode_C
Playlist=Playlist_DefaultSolo
Port=7777
MaxPlayers=100
TeamSize=1
AllowJoinInProgress=False
AllowSpectateAfterDeath=True

[Match]
WarmupCountdownSeconds=120
MinimumPlayersToStart=2
AircraftFlightSeconds=45
SafeZoneStartDelaySeconds=30
EndOfMatchDelaySeconds=15

[Gameplay]
StartingHealth=100
StartingShield=0
MaxHealth=100
MaxShield=100
BackpackSize=5
HealthRegenEnabled=False
FriendlyFireEnabled=False
FloorLootEnabled=True
SupplyDropsEnabled=True

[Logging]
LogLevel=Display
LogFile=Saved/Logs/FortExternalServer.log
